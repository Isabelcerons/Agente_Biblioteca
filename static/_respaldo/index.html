<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c35">
  <title>Biblioteca UniPutumayo — Agente</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">U</div>
      <div>
        <p class="eyebrow">Universidad UniPutumayo</p>
        <h1>Biblioteca UniPutumayo — Agente</h1>
      </div>
      <span class="status"><span class="status-dot"></span> Asistente disponible</span>
    </header>

    <!-- El espacio queda preparado para las pestañas de Mi cuenta, SQL vs pgvector,
         Bitácora y micrófono que se implementarán en la Fase 6. -->
    <section class="chat-card" aria-label="Conversación con el agente">
      <div id="chat-history" class="chat-history" aria-live="polite">
        <article class="message agent-message">
          <div class="avatar" aria-hidden="true">B</div>
          <div class="message-content">
            <p>¡Hola! Puedo ayudarle a buscar materiales, consultar disponibilidad y responder preguntas de la biblioteca.</p>
            <small>Agente de biblioteca</small>
          </div>
        </article>
      </div>
      <form id="chat-form" class="composer">
        <label class="sr-only" for="chat-input">Escriba su mensaje</label>
        <textarea id="chat-input" rows="1" maxlength="2000" placeholder="Escriba su mensaje…" required></textarea>
        <button id="send-button" class="send-button" type="submit">Enviar</button>
      </form>
      <div class="chat-footer">
        <span>Sus consultas se atienden en español.</span>
        <button id="new-chat" class="text-button" type="button">Nueva conversación</button>
      </div>
    </section>
  </main>
</body>
</html>
